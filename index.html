<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竜神の海と猫の釣り人</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfd8e3;--fg:#13202e;--pad:#2b3a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--fg:#dbe8f5;--pad:#223048}}
:root[data-theme="dark"]{--bg:#0b1424;--fg:#dbe8f5;--pad:#223048}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'DotGothic16',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
canvas{width:min(96vw,calc((100vh - 200px)*8/7),768px);aspect-ratio:8/7;image-rendering:pixelated;border:4px solid #000;border-radius:6px;background:#000}
#pad{display:flex;justify-content:space-between;align-items:center;width:min(96vw,768px)}
#dp{display:grid;grid-template:repeat(3,48px)/repeat(3,48px);gap:2px}

#ab b:last-child{background:#b83a4a;margin-bottom:22px}
</style></head><body>
<canvas id="c"></canvas>
<div id="pad"><div id="dp"><b data-k="u" style="grid-area:1/2">▲</b><b data-k="l" style="grid-area:2/1">◀</b><b data-k="r" style="grid-area:2/3">▶</b><b data-k="d" style="grid-area:3/2">▼</b></div><div id="ab"><b data-k="b">B</b><b data-k="a">A</b></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');cv.width=256;cv.height=224;
const FNT='DotGothic16,monospace';
const K={u:0,d:0,l:0,r:0,a:0,b:0};let P={};
function press(k,v){if(v&&!K[k])P[k]=1;K[k]=v?1:0;ac()}
const KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',z:'a',Enter:'a',' ':'a',x:'b',Escape:'b'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){e.preventDefault();press(k,1)}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)press(k,0)});
document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
 el.addEventListener('pointerdown',e=>{e.preventDefault();press(k,1)});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>press(k,0)))});
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function bp(f,d=.08){if(!AC)return;const o=AC.createOscillator(),n=AC.createGain();o.type='square';o.frequency.value=f;n.gain.value=.04;n.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>bp(f,.14),i*110))}
/* ===== データ ===== */
const FISH=[['ハヤ',0,8,15,10,50,1],['アユ',0,15,25,25,30,2],['ヤマメ',0,18,30,60,18,3],['コイ',0,40,70,120,10,5],['ナマズ',0,50,90,200,5,6],['大ナマズ「川のぬし」',0,120,150,2000,1,9,1],
['ワカサギ',1,8,14,15,50,1],['ニジマス',1,25,45,80,28,3],['ブラックバス',1,30,55,110,20,4],['ブルーギル',1,10,20,30,30,2],['イトウ「湖のぬし」',1,110,140,3000,1,10,1],
['アジ',2,15,28,30,45,2],['サバ',2,25,40,50,30,3],['タイ',2,35,70,200,15,5],['ブリ',2,60,90,350,6,7],['マグロ',2,100,200,900,3,9],['竜神',2,200,300,20000,.6,13,1]];
const AREAS=['せせらぎ川','神秘の湖','青の入り江'];
const RODS=[['木の竿',0,1],['竹の竿',300,2],['カーボン竿',1500,3.5],['伝説の竿',8000,5.5]];
const BAITS=[['ミミズ',10,1],['練りエサ',40,1.6],['ルアー',100,2.5]];
const SK='ryujin_neko_v1',DX=[0,1,0,-1],DY=[-1,0,1,0];
let S,mode='title',T=0,tsel=0,dlg=null,menu=null,mv=null,fs=null,fade=30,zone='',zt=0;
const newS=()=>({gold:200,rod:0,bait:[5,0,0],sel:0,inv:[],rec:{},x:12,y:10,f:2,clear:0});
function hasSave(){try{return!!localStorage.getItem(SK)}catch(e){return false}}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));say('セーブした！')}catch(e){say('セーブできなかった…')}}
function loadS(){try{return Object.assign(newS(),JSON.parse(localStorage.getItem(SK)))}catch(e){return newS()}}
/* ===== マップ ===== */
const MW=28,MH=22,M=[];
for(let y=0;y<MH;y++){M[y]=[];for(let x=0;x<MW;x++){let t='.';
 if(x==0||y==0||x==MW-1||y==MH-1)t='T';
 else if(x>=2&&x<=4)t='r';
 else if(x>=18&&x<=26&&y>=2&&y<=7)t='l';
 else if(y>=16&&x>=8&&x<=26)t='s';
 else if(y>=9&&y<=13&&(x>=11&&x<=13))t='.';
 else if((x*7+y*13)%11==0)t='T';
 else if((x*5+y*3)%17==0)t='F';
 M[y][x]=t}}
for(let x=5;x<=20;x++)M[11][x]='=';
for(let y=8;y<=15;y++)M[y][12]='=';
for(let y=8;y<=11;y++)M[y][20]='=';
for(let x=2;x<=4;x++)M[11][x]='B';
for(let y=6;y<=7;y++){for(let x=11;x<=13;x++)M[y][x]='H';for(let x=15;x<=16;x++)M[y-1][x]='h'}
const NPC=[{x:12,y:8,k:'shop',c:['#2a8a5a','#f0d040']},{x:15,y:8,k:'elder',c:['#e8e8e8','#a05050']},{x:6,y:13,k:'fish',c:['#4a70c8','#f0c070']},{x:22,y:9,k:'kid',c:['#e05050','#f8d0a0']}];
NPC.forEach(n=>{if(M[n.y][n.x]!='=')M[n.y][n.x]='.'});
const walk=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&'.=BF'.includes(M[y][x])&&!NPC.some(n=>n.x==x&&n.y==y);
/* ===== 描画ヘルパー ===== */
const rc=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(a,b,w,h)};
function tx(s,x,y,sz=11,col='#fff',sh='#000',al='left'){g.font=sz+'px '+FNT;g.textBaseline='top';g.textAlign=al;if(sh){g.fillStyle=sh;g.fillText(s,x+1,y+1)}g.fillStyle=col;g.fillText(s,x,y);g.textAlign='left'}
function win(x,y,w,h){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#2848b8');gr.addColorStop(1,'#101c60');rc('#fff',x,y,w,h);rc('#8aa0ff',x+1,y+1,w-2,h-2);g.fillStyle=gr;g.fillRect(x+2,y+2,w-4,h-4)}
function cat(x,y,f,w){const R=(c,a,b,ww,h)=>rc(c,x+a,y+b,ww,h),o='#e89a3c';
 R('rgba(0,0,0,.25)',3,14,10,2);R(o,f==3?12:1,8,2,4);R('#2a8a6a',4,8,8,5);R('#d03a3a',4,8,8,1);
 R(o,4,13,3,2-(w?1:0));R(o,9,13,3,1+(w?1:0));R(o,3,2,10,7);R(o,3,0,3,3);R(o,10,0,3,3);R('#f8b8b8',4,1,1,1);R('#f8b8b8',11,1,1,1);
 if(f==2){R('#222',5,5,2,2);R('#222',9,5,2,2);R('#f08080',7,7,2,1)}
 else if(f==3){R('#222',4,5,2,2);R('#f08080',3,7,1,1)}
 else if(f==1){R('#222',10,5,2,2);R('#f08080',12,7,1,1)}else R('#b8641c',6,3,4,1)}
function person(x,y,c){rc('rgba(0,0,0,.25)',x+3,y+14,10,2);rc(c[0],x+4,y+7,8,7);rc('#f8d0a0',x+4,y+2,8,6);rc(c[1],x+3,y,10,3);rc('#222',x+6,y+5,1,2);rc('#222',x+9,y+5,1,2);rc('#654',x+5,y+14,2,2);rc('#654',x+9,y+14,2,2)}
function tile(t,x,y,sx,sy){const h=(x*31+y*17)%7,R=(c,a,b,w,hh)=>rc(c,sx+a,sy+b,w,hh);
 if('rlsB'.includes(t)){R(t=='r'?'#3b8fd0':t=='l'?'#2c6fb5':'#1c4f98',0,0,16,16);if(((x+y+(T>>5))%3)==0)R('#8cc8f0',3+h,5+(h>>1),6,1);if(((x*2+y+(T>>5))%4)==1)R('#6aaee0',8,11,5,1);
  if(t=='B'){R('#a8703a',0,0,16,16);R('#7a4e22',0,4,16,1);R('#7a4e22',0,10,16,1);R('#c8904e',0,0,16,1)}return}
 R('#5fa84a',0,0,16,16);
 if(t=='='){R('#d8b878',0,0,16,16);R('#b89858',2+h,3,2,2);R('#b89858',9,10,2,2)}
 else if(t=='.'||t=='F'){R('#4e9440',2+h,3,1,2);R('#4e9440',10,9,1,2);if(t=='F'){R('#fff',4,5,2,2);R('#f7d',10,10,2,2)}}
 else if(t=='T'){R('#2a5a2e',1,2,14,10);R('#3e8a44',3,0,10,8);R('#6a4020',6,11,4,5)}
 else{const top=M[y-1][x]!=t;if(top){R(t=='H'?'#c0392b':'#7a5030',0,0,16,16);R('rgba(0,0,0,.25)',0,12,16,4);R('rgba(255,255,255,.18)',0,3,16,1)}
  else{R('#e8d8a8',0,0,16,16);R('#7a5a30',0,0,16,2);R('#8ac8f0',3,5,4,4);if(x==12&&t=='H')R('#5a3a18',4,5,8,11)}}}
/* ===== 会話・メニュー ===== */
function say(l,after){dlg={l:Array.isArray(l)?l:[l],i:0,c:0,after}}
function openMenu(it,i0=0,tt=''){menu={it,i:i0,tt}}
function wrap(s,w){const out=[];let cur='';g.font='11px '+FNT;for(const ch of s){if(g.measureText(cur+ch).width>w){out.push(cur);cur=''}cur+=ch}out.push(cur);return out}
const price=v=>{const f=FISH[v.i];return Math.max(1,Math.round(f[4]*v.l/((f[2]+f[3])/2)))};
function shop(){say(['いらっしゃい！ ここは『つりぐや』じゃよ。','なににしますか？'],()=>openMenu([['かう',buy],['うる',sell],['はなす',()=>say('ぬしを つるなら いい竿と いいエサを そろえることじゃな。')],['やめる',()=>say('また きておくれ！')]]))}
function buy(i0=0){const it=[];BAITS.forEach((b,i)=>it.push([`${b[0]} ${b[1]}G (${S.bait[i]})`,()=>{if(S.bait[i]>=99)say('それいじょう もてないよ！',()=>buy(i));else if(S.gold<b[1])say('おかねが たりないね…',()=>buy(i));else{S.gold-=b[1];S.bait[i]++;bp(900,.08);buy(i)}}]));
 const nr=RODS[S.rod+1];if(nr)it.push([`${nr[0]} ${nr[1]}G`,()=>{if(S.gold<nr[1])say('おかねが たりないね…',()=>buy(4));else{S.gold-=nr[1];S.rod++;jingle([660,880,1100]);say(`${nr[0]}を てにいれた！ まいどあり！`,()=>buy(0))}}]);
 it.push(['もどる',()=>say('ほかに ようは？',shop2)]);openMenu(it,Math.min(i0,it.length-1),'G:'+S.gold)}
function shop2(){openMenu([['かう',buy],['うる',sell],['やめる',()=>say('また きておくれ！')]])}
function sell(){if(!S.inv.length){say('うるものが ないようじゃな。',shop2);return}const t=S.inv.reduce((a,v)=>a+price(v),0);
 openMenu([[`ぜんぶ うる (${t}G)`,()=>{S.gold+=t;const n=S.inv.length;S.inv=[];jingle([784,988,1175]);say(`${n}ひきを ${t}Gで かいとったよ！`,shop2)}],['やめる',shop2]],0,S.inv.length+'ひき')}
function mainMenu(i0=0){openMenu([['もちもの',()=>say([`ミケ  G:${S.gold}`,`竿:${RODS[S.rod][0]}  エサ: ${BAITS.map((b,i)=>b[0]+'×'+S.bait[i]).join(' ')}`,`さかなかご: ${S.inv.length}ひき`])],
 ['きろく',()=>say([0,1,2].map(a=>AREAS[a]+'：'+FISH.filter(f=>f[1]==a).map(f=>{const id=FISH.indexOf(f);return S.rec[id]?f[0].split('「')[0].slice(0,5)+S.rec[id]+'cm':'？？'}).join(' ')))],
 ['エサ：'+BAITS[S.sel][0],()=>{S.sel=(S.sel+1)%3;mainMenu(2)}],['セーブ',save],['とじる',null]],i0)}
const TALK={elder:['川と 湖と 海には それぞれ『ぬし』がおる。','海の底には 竜神が ねむると いわれておる。','ぬしを つるなら いい竿と いいエサが いるぞ。'],
 fish:['リールは おしっぱなしじゃ ラインが きれる。','ギュッと まいて はなす…これがコツじゃ。','さかなが あばれたら いったん はなすんじゃ！'],
 kid:['ぼく ハヤを 30ぴき つったよ！','みずうみは おっきい さかなが いるんだって！','おねえちゃん ねこなのに つりが すきなんだね！']};
function interact(){const tx_=S.x+DX[S.f],ty=S.y+DY[S.f],n=NPC.find(n=>n.x==tx_&&n.y==ty);
 if(n){bp(600,.05);if(n.k=='shop')shop();else{const l=TALK[n.k];say(l[Math.floor(Math.random()*l.length)])}return}
 const t=M[ty]&&M[ty][tx_];if('rls'.includes(t)&&t)startFish('rls'.indexOf(t))}
/* ===== 釣り ===== */
function pick(a,bm){const c=FISH.map((f,i)=>i).filter(i=>{const f=FISH[i];return f[1]==a&&!(f[7]&&S.rod<(f[0]=='竜神'?3:1))});
 const w=c.map(i=>{const f=FISH[i];return f[7]?f[5]*bm*bm:f[5]*(1+(bm-1)*f[6]/6)});let r=Math.random()*w.reduce((x,y)=>x+y,0);
 for(let k=0;k<c.length;k++){r-=w[k];if(r<=0)return c[k]}return c[0]}
function startFish(a){if(S.inv.length>=40){say('さかなかごが いっぱいだ！ ショップで うろう。');return}
 if(S.bait[S.sel]<=0){const o=S.bait.findIndex(n=>n>0);if(o<0){say('エサが ない！ ショップで かおう。');return}S.sel=o}
 S.bait[S.sel]--;const bm=BAITS[S.sel][2],id=pick(a,bm),f=FISH[id],len=Math.round(f[2]+(f[3]-f[2])*Math.pow(Math.random(),1.5));
 fs={ph:'cast',t:0,area:a,id,len,str:f[6]*(.8+.4*(len-f[2])/(f[3]-f[2])),prog:0,ten:0,sg:0,nx:90,w:0};mode='fish';bp(300,.15)}
function endFish(m){fs=null;mode='map';bp(200,.25);say(m)}
function land(){const f=FISH[fs.id],l=fs.len,nw=!S.rec[fs.id];S.inv.push({i:fs.id,l});if(nw||S.rec[fs.id]<l)S.rec[fs.id]=l;fs=null;mode='map';
 jingle(f[7]?[523,659,784,1047,784,1047]:[784,988]);const L=[`${f[0]} ${l}cm を つりあげた！`];if(f[7])L.unshift('★ ぬしだ！！ ★');if(nw)L.push('はじめての さかなだ！ きろくに のこした。');
 if(f[0]=='竜神'){S.clear=1;L.push('…竜神は ミケを みつめ しずかに うみへ もどった。','～ THE END ～  (つりは まだまだ つづけられるよ)')}say(L)}
function fishUpdate(){const F=fs;F.t++;
 if(F.ph=='cast'){if(F.t>30){F.ph='wait';F.t=0;F.w=70+Math.random()*180}}
 else if(F.ph=='wait'){if(P.b){endFish('つりを やめた。');return}if(F.t>F.w){F.ph='bite';F.t=0;bp(880,.2)}}
 else if(F.ph=='bite'){if(P.a){F.ph='fight';F.t=0;F.prog=35;F.ten=20;bp(440,.1)}else if(F.t>50)endFish('にげられた…')}
 else{const s=F.str,p=RODS[S.rod][2];
  if(F.sg>0)F.sg--;else if(--F.nx<=0){F.sg=35;F.nx=110+Math.random()*120}
  if(K.a){F.prog+=.35+p*.08;F.ten+=(.55+s*.11)*(1-p*.05);if(T%8==0)bp(200,.03)}else F.ten-=1.3;
  F.prog-=Math.max(0,s-p*1.2)*.04+.05;if(F.sg>0){F.ten+=s*.05;F.prog-=s*.04}F.ten=Math.max(0,F.ten);
  if(F.ten>=100)endFish('ラインが きれた！');else if(F.prog>=100)land();else if(F.prog<=0)endFish('さかなに にげられた…')}}
/* ===== 更新 ===== */
function start(ld){S=ld?loadS():newS();mode='map';mv=null;fade=30;zone='';
 if(!ld)say(['ねこの つりびと『ミケ』は 伝説の 竜神に あうため たびに でた。','ぬしを つりあげ 竜神の うみへ たどりつけ！','（十字キー:いどう  A:はなす/つる  B:メニュー）'])}
function mapUpdate(){
 if(mv){mv.t++;if(mv.t>=8){S.x+=mv.dx;S.y+=mv.dy;mv=null}else return}
 const d=K.u?0:K.r?1:K.d?2:K.l?3:-1;
 if(d>=0){S.f=d;const nx=S.x+DX[d],ny=S.y+DY[d];if(walk(nx,ny))mv={dx:DX[d],dy:DY[d],t:0}}
 else if(P.a)interact();else if(P.b)mainMenu();
 const z=S.x<=7?'川のほとり':S.y<=10&&S.x>=14?'神秘の湖':S.y>=13?'青の入り江':'ミケ村';if(z!=zone){zone=z;zt=120}if(zt>0)zt--}
function update(){T++;if(fade>0)fade--;
 if(dlg){const L=dlg.l[dlg.i];if(dlg.c<L.length)dlg.c+=.7;if(P.a||P.b){if(dlg.c<L.length)dlg.c=L.length;else{dlg.i++;dlg.c=0;bp(660,.04);if(dlg.i>=dlg.l.length){const a=dlg.after;dlg=null;a&&a()}}}return}
 if(menu){const n=menu.it.length;if(P.u){menu.i=(menu.i+n-1)%n;bp(500,.04)}if(P.d){menu.i=(menu.i+1)%n;bp(500,.04)}
  if(P.a){const f=menu.it[menu.i][1];menu=null;bp(700,.05);f&&f()}else if(P.b)menu=null;return}
 if(mode=='title'){if(P.u||P.d){tsel^=1;bp(500,.05)}if(P.a){if(tsel==1&&!hasSave()){bp(150,.2);return}bp(800,.1);start(tsel==1)}}
 else if(mode=='map')mapUpdate();else if(mode=='fish')fishUpdate()}
/* ===== 描画 ===== */
function drawTitle(){
 const gr=g.createLinearGradient(0,0,0,130);gr.addColorStop(0,'#0a0828');gr.addColorStop(.6,'#3a2a78');gr.addColorStop(1,'#e8708a');g.fillStyle=gr;g.fillRect(0,0,256,130);
 for(let i=0;i<40;i++)if(((T>>4)+i)%5)rc('#fff',(i*53)%256,(i*29)%100,1,1);
 g.fillStyle='#fff6c8';g.beginPath();g.arc(214,36,14,0,7);g.fill();g.fillStyle='#e8dca0';g.beginPath();g.arc(209,32,3,0,7);g.fill();
 for(let i=34;i>=1;i--){const x=24+i*6.4,y=70+Math.sin(i*.32+T*.035)*13+i*.2,r=Math.max(2,7-i*.14);g.fillStyle=i%2?'#2ea87a':'#1f8a62';g.beginPath();g.arc(x,y,r,0,7);g.fill();if(i%4==0)rc('#f0d060',x-1,y-r-2,2,3)}
 const hy=70+Math.sin(T*.035)*13;g.fillStyle='#35c08a';g.beginPath();g.arc(24,hy,9,0,7);g.fill();rc('#f0d060',18,hy-13,2,6);rc('#f0d060',27,hy-13,2,6);rc('#f03030',20,hy-3,3,3);rc('#fff',14,hy+3,2,3);
 g.strokeStyle='#f8e888';g.lineWidth=1;g.beginPath();g.moveTo(15,hy+2);g.quadraticCurveTo(6,hy+8,2,hy+2);g.stroke();
