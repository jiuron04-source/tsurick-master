function tourEnd(){const t=S.tour;S.tour=null;$('tm').style.display='none';const rv=[0,0,0].map(()=>100+Math.random()*380|0),rk=1+rv.filter(v=>v>t.s).length,pr=[1500,600,250,0][rk-1];S.gold+=pr;jg(rk<4?[784,988,1175,1568]:[300,250]);say(['しゅうりょう！ ミケの きろく '+t.s+'cm','ライバル: '+rv.join(' / ')+'cm',rk+'いだにゃ！'+(pr?pr+'G ゲット！':'ざんねん…')])}
function mainMenu(){openMenu('メニュー',[['もちもの',()=>say([`G:${S.gold}  🪙${S.coins}`,`竿:${RODS[S.rod][0]}  エサ:${BAITS.map((b,i)=>b[0]+'×'+S.bait[i]).join(' ')}`,`おまもり: Lv${S.ch.join('/')}  さかな:${S.inv.length}ひき`])],
 ['ずかん',()=>say([0,1,2,3].map(a=>AREAS[a]+'：'+FISH.filter(f=>f[1]==a).map(f=>{const id=FISH.indexOf(f);return S.rec[id]?f[0].split('「')[0]+S.rec[id]+'cm':'？？'}).join(' '))) ],['エサ：'+BAITS[S.sel][0],()=>{S.sel=(S.sel+1)%3;mainMenu()}],['セーブ',save],['とじる']])}
const TALK={elder:['川と 湖と 海には「ぬし」が おるぞ。','夜になると 月の池に ふしぎな さかなが あらわれるそうじゃ。','おまもりは ショップで かえるぞい。'],judge:null};
/* 釣り */
function pick(a,bm){const ids=FISH.map((f,i)=>i).filter(i=>{const f=FISH[i],fl=f[7]|0;return f[1]==a&&!(fl&2&&!night)&&!(fl&1&&S.rod<(f[0]=='竜神'?3:a==3?2:1))});
 const w=ids.map(i=>{const f=FISH[i];return(f[7]&1)?f[5]*bm*bm:f[5]*(1+(bm-1)*f[6]/6)});let r=Math.random()*w.reduce((x,y)=>x+y,0);for(let k=0;k<ids.length;k++){r-=w[k];if(r<=0)return ids[k]}return ids[0]}
function waterAhead(){const dx=Math.sin(pl.ry),dz=Math.cos(pl.ry);for(let d=1.2;d<4;d+=.4){const t=wtype(pl.x+dx*d,pl.z+dz*d);if(t>=0)return{a:t,d,dx,dz}}return null}
function startFish(w){if(w.a==3&&!night){say('月の池は 夜にならないと さかなが いないにゃ…');return}
 if(S.inv.length>=40){say('かごが いっぱいにゃ！ うりにいこう！');return}
 if(S.bait[S.sel]<=0){const o=S.bait.findIndex(n=>n>0);if(o<0){say('エサが ないにゃ！ ショップで かうにゃ。');return}S.sel=o}
 S.bait[S.sel]--;const id=pick(w.a,BAITS[S.sel][2]+S.ch[2]*.4),f=FISH[id],len=Math.round(f[2]+(f[3]-f[2])*Math.pow(Math.random(),1.5));
 const from=new R.Vector3(pl.x+w.dx*.8,2.3,pl.z+w.dz*.8),tgt=new R.Vector3(pl.x+w.dx*(w.d+3),.2,pl.z+w.dz*(w.d+3)),edge=new R.Vector3(pl.x+w.dx*(w.d+.3),.2,pl.z+w.dz*(w.d+.3));
 fs={ph:'cast',t:0,id,len,str:f[6]*(.8+.4*(len-f[2])/(f[3]-f[2])),prog:0,ten:0,sg:0,nx:1.5,w:0,from,tgt,edge,dx:w.dx,dz:w.dz,pos:from.clone()};mode='fish';rod.visible=line.visible=bob.visible=true;bp(300,.15)}
function endFish(m){fs=null;mode='play';rod.visible=line.visible=bob.visible=shd.visible=rip.visible=false;$('fight').style.display='none';bp(200,.25);if(m)say(m)}
function land(){const f=FISH[fs.id],l=fs.len,nw=!S.rec[fs.id];S.inv.push({i:fs.id,l});if(nw||S.rec[fs.id]<l)S.rec[fs.id]=l;if(S.tour)S.tour.s+=l;endFish();jump=1;
 jg(f[7]&1?[523,659,784,1047,784,1047]:[784,988]);const em=f[7]&1?'🐉':['🐟','🐠','🐡','✨'][f[1]];$('pop').innerHTML=`<div style="font-size:64px">${em}</div>${f[0]}<br>${l}cm`+(f[7]&1?'<br>★ぬし！★':nw?'<br>NEW!':'');$('pop').style.display='block';setTimeout(()=>$('pop').style.display='none',2300);
 if(f[0]=='竜神'){S.clear=1;say(['…竜神は ミケを みつめ しずかに うみへ もどった。','～ THE END ～  (つりは つづけられるにゃ)'])}}
function fishUpdate(dt){const F=fs,k=dt*60;F.t+=dt;
 if(F.ph=='cast'){if(F.t>.6){F.ph='wait';F.t=0;F.w=1.2+Math.random()*3.5}}
 else if(F.ph=='wait'){if(P.b){endFish('つりを やめたにゃ。');return}if(F.t>F.w){F.ph='bite';F.t=0;bp(880,.25)}}
 else if(F.ph=='bite'){if(P.a){F.ph='fight';F.t=0;F.prog=35;F.ten=20;bp(440,.1);$('fight').style.display='block'}else if(F.t>1)endFish('にげられた…')}
 else{const s=F.str,p=RODS[S.rod][2]+S.ch[1]*.6,tm=1-S.ch[0]*.12;
  if(F.sg>0)F.sg-=k;else if((F.nx-=dt)<=0){F.sg=35;F.nx=1.8+Math.random()*2}
  if(K.a){F.prog+=(.35+p*.08)*k;F.ten+=(.55+s*.11)*(1-p*.05)*tm*k}else F.ten-=1.3*k;
  F.prog-=(Math.max(0,s-p*1.2)*.04+.05)*k;if(F.sg>0){F.ten+=s*.05*tm*k;F.prog-=s*.04*k}F.ten=Math.max(0,F.ten);
  $('tn').style.width=Math.min(100,F.ten)+'%';$('tn').style.background=F.ten>75?'#ff4f4f':F.ten>50?'#ffd34d':'#4cd964';$('pg').style.width=Math.max(0,F.prog)+'%';$('fh').textContent=F.sg>0?'暴れてる！ ボタンを はなせ！':'Aを おしつづけて まきあげろ！';
  if(F.ten>=100)endFish('ラインが きれたにゃ！');else if(F.prog>=100)land();else if(F.prog<=0)endFish('にげられた…')}}
/* 更新 */
const free=(x,z)=>inShop?Math.abs(x-200)<7.4&&z>-5.6&&z<8.5&&!(Math.abs(x-200)<4.8&&z>-3.1&&z<-1.6)&&Math.hypot(x-205.5,z+4)>1.5&&Math.hypot(x-200,z+3.6)>1.2:
 Math.abs(x)<39&&Math.abs(z)<39&&wtype(x,z)<0&&!(Math.abs(x)<5.4&&z>-11.6&&z<-4.4)&&!OB.some(o=>Math.hypot(x-o[0],z-o[1])<o[2]+.5)&&!NP.some(n=>Math.hypot(x-n.x,z-n.z)<1.2);
const near=(x,z,r)=>Math.hypot(pl.x-x,pl.z-z)<r;
function update(dt){time+=dt;tod=(tod+dt/240)%1;
 if(mode=='title')return;
 if(dlg){if(P.a||P.b)adv();return}if(menu){if(P.b)closeMenu();return}
 if(S.tour&&!dlg){S.tour.t-=dt;$('tm').textContent='⏱'+Math.max(0,Math.ceil(S.tour.t))+'s  '+S.tour.s+'cm';if(S.tour.t<=0){if(mode=='fish')endFish();tourEnd();return}}
 if(mode=='fish'){fishUpdate(dt);return}
 let dx=K.r-K.l,dz=K.d-K.u,mvg=false;cd-=dt;
 if(dx||dz){const l=Math.hypot(dx,dz);dx/=l;dz/=l;const sp=6*dt;if(free(pl.x+dx*sp,pl.z))pl.x+=dx*sp;if(free(pl.x,pl.z+dz*sp))pl.z+=dz*sp;pl.ry=Math.atan2(dx,dz);mvg=true}
 if(cd<=0){if(!inShop&&near(0,-3.4,1.3)){inShop=true;pl.x=200;pl.z=6.5;pl.ry=PI;cd=1}else if(inShop&&pl.z>8&&Math.abs(pl.x-200)<2.5){inShop=false;pl.x=0;pl.z=-2.6;pl.ry=0;cd=1}}
 world.visible=!inShop;sh.visible=inShop;cat.userData.mv=mvg;
 if(P.a){if(inShop){if(near(200,-3.6,3.6))say(['いらっしゃいにゃ！ つりぐや へ ようこそ！'],shopMenu);else if(near(205.5,-4,3))slot()}
  else{const n=NP.find(n=>near(n.x,n.z,3));if(n){if(n.k=='judge')say('釣り大会の うけつけにゃ！',judge);else say(TALK.elder[Math.random()*3|0])}else{const w=waterAhead();if(w)startFish(w)}}}
 else if(P.b)mainMenu()}
/* 描画 */
const C1=new R.Color('#0b1030'),C2=new R.Color('#8fd8ff'),C3=new R.Color('#ff9a6a'),cc=new R.Color();
function render(dt){
 sunH=-Math.cos(tod*PI*2);night=sunH<-.05;const k=Math.max(0,Math.min(1,sunH*1.6+.4)),dusk=Math.max(0,1-Math.abs(sunH)/.3)*.55;
 cc.copy(C1).lerp(C2,k).lerp(C3,dusk);const kk=inShop?1:k;
 if(inShop){scene.background=new R.Color('#f6dfba');scene.fog.far=999}else{scene.background=cc;scene.fog.color.copy(cc);scene.fog.far=110}
 hemi.intensity=.35+.75*kk;sun.intensity=inShop?.2:.1+1.1*k;sun.position.set(30*Math.sin(tod*PI*2),40*Math.max(.15,sunH)+8,25);sun.target.position.set(pl.x,0,pl.z);il.intensity=inShop?1.4:0;
 stars.material.opacity=inShop?0:1-k;moon.visible=!inShop&&k<.6;pond.material.emissiveIntensity=(1-k)*1.2;
 const h=tod*24|0,m=(tod*1440%60)|0;$('clk').textContent=(night?'🌙 ':'☀️ ')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');$('gd').textContent='💰 '+(S?S.gold:0)+'G';$('cn').textContent='🪙 '+(S?S.coins:0);
 const ud=cat.userData;let tw=Math.sin(time*(ud.mv?9:3))*.5;ud.tail.rotation.z=tw;ud.hd.rotation.z=Math.sin(time*2)*.05;
 if(jump>0){jump-=dt*1.4;cat.position.y=Math.abs(Math.sin((1-jump)*PI*3))*1.1}else cat.position.y=ud.mv?Math.abs(Math.sin(time*12))*.18:0;
 let d=pl.ry-cat.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));cat.rotation.y+=d*Math.min(1,dt*12);cat.position.x=pl.x;cat.position.z=pl.z;
 skp.userData.tail.rotation.z=Math.sin(time*3)*.5;NP.forEach((n,i)=>n.o.userData.tail.rotation.z=Math.sin(time*3+i)*.5);
 if(mode=='title'){const a=time*.25;cam.position.set(Math.sin(a)*13,5,4+Math.cos(a)*13);cam.lookAt(0,1.5,4);cat.rotation.y=PI*.85;pl.ry=PI*.85}
 else if(mode=='fish'&&fs){const F=fs;let p=bob.position;
  if(F.ph=='cast'){const u=Math.min(1,F.t/.6);p.lerpVectors(F.from,F.tgt,u);p.y+=Math.sin(u*PI)*3}
  else if(F.ph=='fight'){p.lerpVectors(F.tgt,F.edge,Math.max(0,Math.min(1,F.prog/100)));p.x+=F.sg>0?Math.sin(time*30)*.2:0;p.y=.2+Math.sin(time*9)*.05}
  else p.set(F.tgt.x,.2+Math.sin(time*3)*.05-(F.ph=='bite'?.15+Math.sin(time*40)*.05:0),F.tgt.z);
  rod.updateWorldMatrix(true,false);const tip=new R.Vector3(0,4.4,0);rod.localToWorld(tip);lg.setFromPoints([tip,p]);
  rip.visible=F.ph!='cast';const q=(time*.8)%1;rip.position.set(p.x,.12,p.z);rip.scale.setScalar(1+q*3);rip.material.opacity=1-q;
  shd.visible=F.ph=='fight'||F.ph=='bite';if(shd.visible){const w=.5+FISH[F.id][3]/90;shd.scale.set(w*1.5,.1,w*.6);shd.position.set(p.x+F.dx*1.6,.1,p.z+F.dz*1.6);shd.rotation.y=Math.atan2(F.dx,F.dz)+PI/2+(F.sg>0?Math.sin(time*20)*.4:0)}
  cam.position.lerp(new R.Vector3(pl.x-F.dx*5,4.2,pl.z-F.dz*5),Math.min(1,dt*4));cam.lookAt((pl.x+p.x)/2,.8,(pl.z+p.z)/2)}
 else{const o=inShop?new R.Vector3(pl.x*.5+100,8,pl.z+8):new R.Vector3(pl.x,9,pl.z+11);cam.position.lerp(o,Math.min(1,dt*5));cam.lookAt(inShop?pl.x*.5+100:pl.x,1,pl.z-1)}
 ren.render(scene,cam)}
/* 開始 */
function begin(ld){ac();S=newS();if(ld)try{Object.assign(S,JSON.parse(localStorage.getItem(SK)))}catch(e){}tod=S.tod;pl={x:0,z:4,ry:0};inShop=false;mode='play';$('title').style.display='none';
 if(S.tour){S.tour=null;$('tm').style.display='none'}
 if(!ld)say(['ねこの つりびと「ミケ」は 伝説の 竜神に あうため たびに でたにゃ！','ぬしを つりあげ、うみの おくの 竜神を めざせ！','（いどう:十字キー  A:はなす/つる  B:メニュー）','まずは ショップ(赤い屋根)で エサを かうにゃ。'])}
$('b1').onclick=()=>begin(false);$('b2').onclick=()=>{if(hasSave())begin(true);else $('b2').textContent='セーブなし'};
S=newS();let lt=performance.now();function loop(n){const dt=Math.min(.05,(n-lt)/1000);lt=n;update(dt);P={};render(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
